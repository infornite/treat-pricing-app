<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treat Plumbing — Job Pricing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --hdr:#0c2135;
  --pri:#1d55d3;
  --pri-lite:#dbeafe;
  --pri-text:#1e40af;
  --amber:#b45309;
  --amber-bg:#fef3c7;
  --amber-bd:#fbbf24;
  --red:#b91c1c;
  --red-bg:#fef2f2;
  --red-bd:#fca5a5;
  --bg:#eef2f7;
  --surf:#fff;
  --border:#e2e8f0;
  --text:#0f172a;
  --text2:#374151;
  --mute:#6b7280;
  --r:10px;
  --sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;font-size:16px;
}
#app{
  display:flex;flex-direction:column;
  height:100dvh;max-width:500px;margin:0 auto;
  background:var(--bg);
}

/* ── Header ── */
#hdr{
  flex-shrink:0;background:var(--hdr);color:#fff;
  padding-top:env(safe-area-inset-top,0px);
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px}
.hdr-logo{display:flex;align-items:center;gap:10px}
.logo-mark{
  width:32px;height:32px;background:rgba(255,255,255,.15);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;letter-spacing:-0.5px
}
.hdr-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.draft-badge{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#f59e0b;color:#7c2d12;padding:3px 8px;border-radius:4px
}
.draft-banner{
  background:var(--amber-bg);border-top:1px solid var(--amber-bd);
  color:var(--amber);font-size:12px;font-weight:600;letter-spacing:.01em;
  text-align:center;padding:7px 16px;line-height:1.4
}
.tabs{display:flex;background:var(--hdr);padding:0 16px;border-top:1px solid rgba(255,255,255,.08)}
.tab-btn{
  flex:1;background:none;border:none;color:rgba(255,255,255,.5);
  font-size:14px;font-weight:500;padding:11px 0 9px;cursor:pointer;
  position:relative;transition:color .15s;letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent
}
.tab-btn.active{color:#fff}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:16px;right:16px;
  height:2px;background:#60a5fa;border-radius:2px 2px 0 0
}

/* ── Main scroll ── */
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 0}

/* ── Section labels ── */
.slabel{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);padding:0 2px 8px;margin-top:20px
}
.slabel:first-child{margin-top:0}

/* ── System grid ── */
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sys-btn{
  background:var(--surf);border:2px solid var(--border);border-radius:var(--r);
  padding:14px 12px 12px;cursor:pointer;text-align:left;
  transition:all .15s;box-shadow:var(--sh);min-height:74px;
  display:flex;flex-direction:column;gap:4px;
  -webkit-tap-highlight-color:transparent
}
.sys-btn:active{transform:scale(.97)}
.sys-btn.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.sys-name{font-size:14px;font-weight:600;line-height:1.3;color:inherit}
.sys-n{font-size:11px;color:var(--mute);margin-top:2px}
.sys-btn.sel .sys-n{color:rgba(255,255,255,.6)}

/* ── Radio list ── */
.rlist{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rrow{
  display:flex;align-items:flex-start;padding:13px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);gap:12px;transition:background .1s;
  -webkit-tap-highlight-color:transparent
}
.rrow:last-child{border-bottom:none}
.rrow:active{background:var(--bg)}
.rind{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-top:1px
}
.rrow.sel .rind{border-color:var(--pri);background:var(--pri)}
.rdot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transform:scale(0);transition:all .15s}
.rrow.sel .rdot{opacity:1;transform:scale(1)}
.rlabel{font-size:15px;font-weight:500;color:var(--text)}
.rsub{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}

/* ── Toggle list ── */
.tlist{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.trow{
  display:flex;align-items:flex-start;padding:13px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);gap:12px;transition:background .1s;
  -webkit-tap-highlight-color:transparent
}
.trow:last-child{border-bottom:none}
.trow:active{background:var(--bg)}
.trow.chk{background:#f0f6ff}
.tcontent{flex:1;min-width:0}
.tlabel{font-size:15px;font-weight:500;color:var(--text)}
.tsub{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.tprice{font-size:15px;font-weight:600;color:var(--text2);flex-shrink:0;margin-left:8px;padding-top:2px}
.chkbox{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-top:1px
}
.trow.chk .chkbox{background:var(--pri);border-color:var(--pri)}

/* ── Alert banners ── */
.warn{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:var(--r);padding:14px 16px}
.warn-title{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.warn-body{font-size:13px;color:#78350f;line-height:1.55}
.danger{background:var(--red-bg);border:2px solid var(--red-bd);border-radius:var(--r);padding:14px 16px}
.danger-title{font-size:13px;font-weight:700;color:var(--red);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.danger-body{font-size:13px;color:#7f1d1d;line-height:1.55}

/* Relining caveat gets bigger treatment */
.reline-warn{
  background:var(--amber-bg);border:2px solid var(--amber-bd);
  border-radius:var(--r);padding:16px
}
.reline-warn-title{
  font-size:15px;font-weight:700;color:var(--amber);
  margin-bottom:8px;display:flex;align-items:center;gap:7px
}
.reline-warn-body{font-size:14px;color:#78350f;line-height:1.6}
.reline-est-box{
  margin-top:12px;background:rgba(255,255,255,.55);
  border-radius:8px;padding:10px 12px
}
.reline-est-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0}
.reline-est-label{color:#92400e}
.reline-est-val{font-weight:700;color:#7c2d12}

/* ── Bottom price panel ── */
#price-panel{
  flex-shrink:0;background:var(--surf);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 12px rgba(0,0,0,.07);
  padding:0 16px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),8px)
}
.pc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0 11px;cursor:pointer
}
.pc-main{flex:1}
.pc-range{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.15;color:var(--text)}
.pc-mid{font-size:13px;color:var(--mute);margin-top:3px}
.pc-chev{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--mute);flex-shrink:0;transition:transform .2s}
.pc-chev.up{transform:rotate(180deg)}
.pc-body{border-top:1px solid var(--border);padding-bottom:4px}
.pc-section{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:10px 0 4px}
.pc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px}
.pc-row.divider{border-top:1px solid var(--border);margin-top:4px;padding-top:10px}
.pc-lbl{color:var(--text2);flex:1}
.pc-val{font-weight:600;color:var(--text);text-align:right}
.pc-val.up{color:#15803d}
.pc-val.dn{color:#9a3412}
.pc-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--text);padding-top:10px;margin-top:6px}
.pc-total-lbl{font-size:15px;font-weight:700}
.pc-total-val{font-size:20px;font-weight:700}
.pc-total-range{font-size:12px;color:var(--mute);text-align:right;padding-bottom:6px}
.pc-footnote{font-size:11px;color:var(--mute);line-height:1.5;padding:8px 0 4px}
.pc-empty{padding:15px 0;color:var(--mute);font-size:15px;text-align:center}

/* ── Quoted component cards ── */
.comp-list{display:flex;flex-direction:column;gap:10px}
.comp-card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.comp-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.comp-num{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.comp-type{font-size:16px;font-weight:600;margin-top:2px;flex:1}
.comp-btns{display:flex;gap:8px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:none;
  background:var(--bg);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s;-webkit-tap-highlight-color:transparent
}
.icon-btn:active{background:var(--border)}
.comp-price-range{font-size:20px;font-weight:700;margin-top:8px}
.comp-price-mid{font-size:13px;color:var(--mute);margin-top:2px}
.comp-price-warn{font-size:13px;color:var(--amber);margin-top:3px;font-weight:600}
.comp-sub-notice{
  background:var(--amber-bg);border:1px solid var(--amber-bd);
  border-radius:8px;padding:10px 14px;margin-top:10px;
  font-size:13px;color:#78350f;line-height:1.5
}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{
  font-size:12px;background:var(--pri-lite);color:var(--pri-text);
  padding:3px 8px;border-radius:20px;font-weight:500
}

/* ── Quoted panel ── */
.qp-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
.qp-lbl{font-size:14px;font-weight:600;color:var(--text2)}
.qp-val{font-size:22px;font-weight:700;color:var(--text)}
.qp-note{font-size:12px;color:var(--mute);padding-bottom:10px}
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;background:var(--surf);
  border:2px dashed var(--border);border-radius:var(--r);
  color:var(--pri);font-size:15px;font-weight:600;
  cursor:pointer;transition:all .15s;box-shadow:var(--sh);margin-top:10px;
  -webkit-tap-highlight-color:transparent
}
.add-btn:active{background:var(--pri-lite)}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 24px;color:var(--mute)}
.empty-icon{width:48px;height:48px;background:var(--border);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:8px}
.empty-body{font-size:14px;line-height:1.5}

/* ── Modal ── */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:90
}
#overlay.open{opacity:1;pointer-events:auto}
#modal{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:100%;max-width:500px;height:92dvh;
  background:var(--surf);border-radius:18px 18px 0 0;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  z-index:91;display:flex;flex-direction:column;
}
#modal.open{transform:translateX(-50%) translateY(0)}
.m-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.m-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0
}
.m-title{font-size:17px;font-weight:700}
.m-close{
  width:30px;height:30px;border-radius:50%;background:var(--bg);
  border:none;color:var(--text2);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent
}
.m-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 0}
.m-foot{
  padding:12px 16px;
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);flex-shrink:0
}
.btn-pri{
  width:100%;padding:15px;background:var(--pri);color:#fff;
  border:none;border-radius:var(--r);font-size:16px;font-weight:600;
  cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent
}
.btn-pri:active{opacity:.85}
.btn-pri:disabled{background:var(--border);color:var(--mute);cursor:not-allowed}
.text-inp{
  width:100%;padding:13px 14px;background:var(--surf);
  border:1.5px solid var(--border);border-radius:var(--r);
  font-size:16px;color:var(--text);outline:none;
  transition:border-color .15s;box-shadow:var(--sh)
}
.text-inp:focus{border-color:var(--pri)}

/* Confidence badge */
.cbadge{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.04em;vertical-align:middle;margin-left:6px
}
.cbadge.med{background:var(--amber-bg);color:var(--amber)}
.cbadge.sub{background:#f0fdf4;color:#166534}

/* Estimate-leads card price format */
.c-est{font-size:22px;font-weight:700;color:var(--text);margin-top:8px}
.c-range{font-size:13px;color:var(--mute);margin-top:2px}

/* Estimate-leads bottom panel */
.pc-est-big{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.15;color:var(--text)}

.scroll-pad{height:20px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">
        <div class="logo-mark">TP</div>
        <span class="hdr-title">Treat Plumbing Pricing</span>
      </div>
      <span class="draft-badge">Draft</span>
    </div>
    <div class="draft-banner">
      Draft tool &mdash; pending owner review. Do not use for final pricing without Peter's sign-off.
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="reactive">Reactive jobs</button>
      <button class="tab-btn" data-tab="quoted">Quoted works</button>
    </div>
  </div>
  <div id="main">
    <div id="vr"></div>
    <div id="vq" style="display:none"></div>
  </div>
  <div id="price-panel"></div>
</div>
<div id="overlay"></div>
<div id="modal">
  <div class="m-handle"></div>
  <div class="m-head">
    <span class="m-title" id="m-title">Add component</span>
    <button class="m-close" id="m-close">&#x2715;</button>
  </div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot" id="m-foot"></div>
</div>

/* ═══════════════════════════════════════════
   CALC — REACTIVE COMPONENT
   ═══════════════════════════════════════════ */
function calcRComp(comp){
  const sys=M.reactive[comp.si];
  let est=sys.base;
  const factors=[];
  sys.conds.forEach(c=>{
    const active=c.k==="diagnosis_only"
      ? comp.act==="diagnose"
      : comp.chars.has(c.k);
    if(active){est*=(1+c.pct/100);factors.push(c);}
  });
  let addonAmt=0;
  const addons=[];
  M.addons.forEach(a=>{
    if(comp.addons.has(a.k)){addonAmt+=a.amt;addons.push(a);}
  });
  const coreLo=est*sys.lo, coreHi=est*sys.hi;
  return{
    sys,base:sys.base,est:Math.round(est),
    lo:Math.round(coreLo),hi:Math.round(coreHi),
    addonAmt,addons,
    totLo:Math.round(coreLo+addonAmt),
    totHi:Math.round(coreHi+addonAmt),
    tot:Math.round(est+addonAmt),
    factors,n:sys.n
  };
}

/* ═══════════════════════════════════════════
   CALC — QUOTED COMPONENT
   ═══════════════════════════════════════════ */
function calcComp(comp){
  if(comp.wt==="Making good (remedial finishes)"||comp.wt==="Other") return null;
  const wt=M.quoted.find(q=>q.wt===comp.wt);
  if(!wt||wt.conf==="none") return null;
  let est=wt.base;
  const factors=[];
  wt.conds.forEach(c=>{
    if(comp.chars.has(c.k)){
      est*=c.f;factors.push(c);
    }
  });
  const useReline=(comp.wt==="Sewer relining"&&comp.m&&parseFloat(comp.m)>0);
  let relineEst=null;
  if(useReline) relineEst=Math.round(M.reline.setup+M.reline.per_m*parseFloat(comp.m));
  const finalEst=useReline?relineEst:Math.round(est);
  // For relining, apply the model band to the length estimate so the range still leads
  const finalLo=Math.round((useReline?relineEst:est)*wt.lo);
  const finalHi=Math.round((useReline?relineEst:est)*wt.hi);
  return{
    wt,est:finalEst,
    lo:finalLo,hi:finalHi,
    modelEst:Math.round(est),factors,useReline,relineEst
  };
}

    r.comps.forEach((comp,idx)=>{

      let chips='<div class="chips">';

        <div class="danger-title">${ICO.danger()} Asbestos risk noted</div>
        <div class="danger-body">Do not disturb any materials until an asbestos management plan is in place. Handle separately from this pricing.</div>
      </div>`:"";

      h+=`<div class="comp-card">
        <div class="comp-hdr">
          <div>
            <div class="comp-num">Item ${idx+1}</div>
            <div class="comp-type">${SYS_SHORT[sys.sys]||sys.sys}${act?" &middot; "+act.l:""}</div>

    });

  h+=`<button class="add-btn" data-a="open-rmo">${ICO.plus()} Add job item</button>`;
  h+='<div class="scroll-pad"></div>';
  $("vr").innerHTML=h;
}

        const s=f.pct>=0?"+":"";

        h+=`<div class="pc-row"><span class="pc-lbl">${f.lbl}</span><span class="pc-val ${cls}">${s}${f.pct}%</span></div>`;
      });
      h+=`<div class="pc-row divider"><span class="pc-lbl" style="font-weight:600">Core works</span><span class="pc-val" style="font-weight:700">${fmt(single.est)}</span></div>`;

    </div>`;
  } else {
    h+='<p class="slabel">Components</p><div class="comp-list">';
    q.comps.forEach((comp,idx)=>{
      const calc=calcComp(comp);
      const isMG=comp.wt==="Making good (remedial finishes)";
      const isOther=comp.wt==="Other";
      const wtData=M.quoted.find(d=>d.wt===comp.wt);
      const isMed=wtData?.conf==="medium";
      const manualPrice=comp.price&&parseFloat(comp.price)>0?parseFloat(comp.price):null;
      let priceH="";

        priceH=manualPrice
          ?`<div class="c-est" style="font-size:18px">${fmt(manualPrice)}</div><div class="c-range">Subcontracted pass-through</div>`
          :`<div class="comp-sub-notice">Subcontracted &mdash; edit to enter the trade quote amount.</div>`;

          ?`<div class="c-est">${fmt(manualPrice)}</div><div class="c-range">Manual price</div>`
          :`<div style="color:var(--mute);font-size:14px;margin-top:8px">No price entered &mdash; edit to add one</div>`;
      } else if(!calc){
        priceH=`<div style="color:var(--mute);font-size:14px;margin-top:8px">No model data</div>`;
      } else {
        const confH=isMed?`<span class="cbadge med">Medium confidence</span>`:"";
        if(calc.useReline){
          priceH=`<div class="c-est">${rng(calc.lo,calc.hi)}${confH}</div>
            <div class="c-range">length estimate around ${fmt(calc.est)} &middot; ${calc.wt.n.toLocaleString()} jobs</div>
            <div class="comp-price-warn">${ICO.warn()} Low confidence &mdash; length explains only 20% of relining price variation.</div>`;
        } else {
          priceH=`<div class="c-est">${fmt(calc.est)}${confH}</div>
            <div class="c-range">${rng(calc.lo,calc.hi)} &middot; ${calc.wt.n.toLocaleString()} jobs</div>`;
        }
      }
      let chips="";
      if(comp.chars.size>0||comp.m){
        chips='<div class="chips">';

          const cond=wtD?.conds.find(c=>c.k===ck);
          const lbl=cond?cond.lbl:ck;

  h+='<div class="scroll-pad"></div>';

  if(q.comps.length===0){
    p.innerHTML='<div class="pc-empty">Add components above to see a total</div>';
    return;
  }
  let total=0;
  const notes=[],plumbRows=[],mgRows=[];
  let hasReline=false;
  q.comps.forEach(comp=>{
    const manualAmt=comp.price&&parseFloat(comp.price)>0?parseFloat(comp.price):null;
    if(comp.wt==="Making good (remedial finishes)"){
      mgRows.push({lbl:"Making good (subcontracted)",val:manualAmt?fmt(manualAmt):"Enter amount in edit",muted:!manualAmt});
    } else if(comp.wt==="Other"){
      if(manualAmt){total+=manualAmt;plumbRows.push({lbl:"Other",val:fmt(manualAmt),muted:false});}
      else{notes.push("Other: no price entered");}
    } else {
      const c=calcComp(comp);
      if(c){
        total+=c.est;
        plumbRows.push({lbl:comp.wt,val:fmt(c.est),muted:false});
        if(comp.wt==="Sewer relining"&&comp.m) hasReline=true;
      }
    }
  });
  if(hasReline) notes.push("Relining est. low confidence");

  let h=`<div class="pc-header" id="qptog">
    <div class="pc-main">
      <div class="pc-est-big">${fmt(total)}</div>
      ${notes.length?`<div class="pc-mid" style="color:var(--amber)">*${notes.join(" · ")}</div>`:""}

    </div>
    <div class="pc-chev${S.qpx?" up":""}">${ICO.chev()}</div>
  </div>`;

  if(S.qpx){
    h+='<div class="pc-body">';
    // Per-component detailed breakdown
    q.comps.forEach((comp,idx)=>{
      const manualAmt=comp.price&&parseFloat(comp.price)>0?parseFloat(comp.price):null;
      const isMG=comp.wt==="Making good (remedial finishes)";
      const isOther=comp.wt==="Other";
      const calc=(!isMG&&!isOther)?calcComp(comp):null;
      const label=QWT_SHORT[comp.wt]||comp.wt;

      h+=`<div class="pc-section" style="margin-top:${idx>0?8:0}px">${label}</div>`;

      if(isMG){
        h+=`<div class="pc-row"><span class="pc-lbl" style="color:var(--mute)">Subcontracted pass-through</span><span class="pc-val" style="color:var(--mute)">${manualAmt?fmt(manualAmt):"No amount entered"}</span></div>`;
      } else if(isOther){
        h+=`<div class="pc-row"><span class="pc-lbl" style="color:var(--mute)">Manual price</span><span class="pc-val" style="color:var(--mute)">${manualAmt?fmt(manualAmt):"No amount entered"}</span></div>`;
      } else if(calc){
        const wt=calc.wt;
        if(calc.useReline){
          h+=`<div class="pc-row"><span class="pc-lbl">Length model (${comp.m}m)</span><span class="pc-val">${fmt(calc.est)}</span></div>`;
          h+=`<div class="pc-row"><span class="pc-lbl" style="font-size:12px;color:var(--mute)">Low confidence &middot; R²=0.20</span></div>`;
        } else {
          h+=`<div class="pc-row"><span class="pc-lbl">Base ${label}</span><span class="pc-val">${fmt(wt.base)}</span></div>`;
          calc.factors.forEach(f=>{
            const pct=Math.round((f.f-1)*100);
            const sign=pct>=0?"+":"";
            const cls=pct>=0?"up":"dn";
            h+=`<div class="pc-row"><span class="pc-lbl">${f.lbl}</span><span class="pc-val ${cls}">${sign}${pct}%</span></div>`;
          });
        }
        h+=`<div class="pc-row" style="border-top:1px solid var(--border);margin-top:2px;padding-top:6px">
          <span class="pc-lbl" style="font-weight:600">Estimate</span>
          <span class="pc-val" style="font-weight:700">${fmt(calc.est)}</span>
        </div>`;
        h+=`<div class="pc-row" style="padding-top:1px"><span class="pc-lbl" style="font-size:12px;color:var(--mute)">Range</span><span class="pc-val" style="font-size:12px;color:var(--mute)">${rng(calc.lo,calc.hi)} &middot; ${wt.n.toLocaleString()} jobs</span></div>`;
      }
    });

    // Grand total line
    if(q.comps.filter(c=>c.wt!=="Making good (remedial finishes)").length>1){
      h+=`<div class="pc-total" style="margin-top:10px"><span class="pc-total-lbl">Plumbing total</span><span class="pc-total-val">${fmt(total)}</span></div>`;
    }
    if(mgRows.length){
      h+=`<div class="pc-section" style="margin-top:8px">Subcontracted (separate from total)</div>`;
      mgRows.forEach(r=>{
        h+=`<div class="pc-row"><span class="pc-lbl" style="${r.muted?"color:var(--mute)":""}">${r.lbl}</span><span class="pc-val" style="${r.muted?"color:var(--mute)":""}">${r.val}</span></div>`;
      });
    }
    h+=`<div class="pc-footnote">Weighted jobs Jan 2023 to Jun 2026. Range covers the middle band of actual invoiced prices. Guide for staff only, not a binding quote.</div>`;
    h+="</div>";
  }
  p.innerHTML=h;
  $("qptog")?.addEventListener("click",()=>{S.qpx=!S.qpx;renderQP();});
}

/* ═══════════════════════════════════════════
   MODAL — SHARED OPEN/CLOSE
   ═══════════════════════════════════════════ */
function openModal(type,comp){
  S.mt=type;
  if(type==="r"){
    const mo=S.rmo;
    if(comp){
      mo.eid=comp.id;mo.si=comp.si;mo.act=comp.act;
      mo.chars=new Set(comp.chars);mo.addons=new Set(comp.addons);mo.asbestos=comp.asbestos;
    } else {
      mo.eid=null;mo.si=null;mo.act=null;
      mo.chars=new Set();mo.addons=new Set();mo.asbestos=false;
    }
    $("m-title").textContent=comp?"Edit job item":"Add job item";
  } else {
    const mo=S.qmo;
    if(comp){
      mo.eid=comp.id;mo.wt=comp.wt;mo.m=comp.m||"";mo.chars=new Set(comp.chars);mo.price=comp.price||"";
    } else {
      mo.eid=null;mo.wt=null;mo.m="";mo.chars=new Set();mo.price="";
    }
    $("m-title").textContent=comp?"Edit component":"Add component";
  }
  $("overlay").classList.add("open");
  $("modal").classList.add("open");
  S.mt==="r"?renderRMo():renderQMo();
}

function closeModal(){
  $("overlay").classList.remove("open");
  $("modal").classList.remove("open");
}

/* ═══════════════════════════════════════════
   MODAL — REACTIVE CONTENT
   ═══════════════════════════════════════════ */
function renderRMo(){
  const mo=S.rmo;
  const sys=mo.si!==null?M.reactive[mo.si]:null;
  const visConds=sys?sys.conds.filter(c=>c.k!=="diagnosis_only"):[];
  const hasDiag=sys?sys.conds.some(c=>c.k==="diagnosis_only"):false;
  let h="";

  h+='<p class="slabel" style="margin-top:0">System</p><div class="sys-grid">';
  M.reactive.forEach((s,i)=>{
    const sel=mo.si===i?"sel":"";
    h+=`<button class="sys-btn ${sel}" data-a="r-sys" data-i="${i}">
      <span class="sys-name">${SYS_SHORT[s.sys]||s.sys}</span>
      <span class="sys-n">${s.n.toLocaleString()} jobs</span>
    </button>`;
  });
  h+="</div>";

  if(sys){
    h+='<p class="slabel" style="margin-top:20px">What was done?</p><div class="rlist">';
    ACTIONS.forEach(a=>{
      const sel=mo.act===a.k?"sel":"";
      let sub="";
      if(a.k==="diagnose"){
        if(hasDiag){
          const d=sys.conds.find(c=>c.k==="diagnosis_only");
          sub=`<span class="rsub">Reduces estimate by ${Math.abs(d.pct)}% for this system</span>`;
        } else {
          sub='<span class="rsub">No price adjustment for this system in the model</span>';
        }
      }
      h+=`<div class="rrow ${sel}" data-a="r-act" data-k="${a.k}">
        <div class="rind"><div class="rdot"></div></div>
        <div class="tcontent"><span class="rlabel">${a.l}</span>${sub}</div>
      </div>`;
    });
    h+="</div>";

    if(visConds.length>0){
      h+='<p class="slabel" style="margin-top:20px">Characteristics that apply</p><div class="tlist">';
      visConds.forEach(c=>{
        const chk=mo.chars.has(c.k)?"chk":"";
        const sign=c.pct>=0?"+":"";
        h+=`<div class="trow ${chk}" data-a="r-char" data-k="${c.k}">
          <div class="chkbox">${chk?ICO.chk():""}</div>
          <div class="tcontent">
            <span class="tlabel">${c.lbl}</span>
            <span class="tsub">${sign}${c.pct}% to core estimate</span>
          </div>
        </div>`;
      });
      h+="</div>";
    } else if(sys.conds.length===0){
      h+=`<div class="warn" style="margin-top:12px"><div class="warn-body">No model characteristics for this system. Fixed base estimate: ${fmt(sys.base)}.</div></div>`;
    }

    h+='<p class="slabel" style="margin-top:20px">Add-ons and line items</p><div class="tlist">';
    M.addons.forEach(a=>{
      const chk=mo.addons.has(a.k)?"chk":"";
      h+=`<div class="trow ${chk}" data-a="r-addon" data-k="${a.k}">
        <div class="chkbox">${chk?ICO.chk():""}</div>
        <div class="tcontent"><span class="tlabel">${a.name}</span></div>
        <span class="tprice">+${fmt(a.amt)}</span>
      </div>`;
    });
    h+="</div>";

    h+='<p class="slabel" style="margin-top:20px">Safety</p><div class="tlist">';
    const abChk=mo.asbestos?"chk":"";
    h+=`<div class="trow ${abChk}" data-a="r-asb">
      <div class="chkbox">${abChk?ICO.chk():""}</div>
      <div class="tcontent">
        <span class="tlabel">Pre-1987 building or possible asbestos</span>
        <span class="tsub">Raises a safety flag on the item card &mdash; no price change</span>
      </div>
    </div></div>`;
  }
  h+='<div class="scroll-pad"></div>';
  $("m-body").innerHTML=h;

  // Footer: live price preview + save
  const canSave=mo.si!==null;
  let footH="";
  if(canSave){
    const preview=calcRComp({si:mo.si,act:mo.act,chars:mo.chars,addons:mo.addons,asbestos:false});
    const hasA=preview.addonAmt>0;
    const dE=hasA?preview.tot:preview.est;
    const dLo=hasA?preview.totLo:preview.lo;
    const dHi=hasA?preview.totHi:preview.hi;
    footH+=`<div style="padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px">
      <div style="font-size:20px;font-weight:700;color:var(--text)">${fmt(dE)}</div>
      <div style="font-size:13px;color:var(--mute)">${rng(dLo,dHi)} &middot; ${preview.n.toLocaleString()} similar jobs</div>
    </div>`;
  }
  footH+=`<button class="btn-pri" id="m-save" ${canSave?"":"disabled"}>${mo.eid!==null?"Update item":"Add item"}</button>`;
  $("m-foot").innerHTML=footH;
}

/* ═══════════════════════════════════════════
   MODAL — QUOTED CONTENT
   ═══════════════════════════════════════════ */
function renderQMo(){
  const mo=S.qmo;
  const isMG=mo.wt==="Making good (remedial finishes)";
  const isOther=mo.wt==="Other";
  const isReline=mo.wt==="Sewer relining";
  const wtData=mo.wt?M.quoted.find(d=>d.wt===mo.wt):null;
  let h="";

  /* Grid picker — mirrors reactive system grid */
  h+='<p class="slabel" style="margin-top:0">Work type</p><div class="sys-grid">';
  WTS.forEach(t=>{
    const sel=mo.wt===t?"sel":"";
    const d=M.quoted.find(q=>q.wt===t);
    let sub="";
    if(d?.conf==="medium") sub=`${d.n} jobs <span style="color:var(--amber);font-weight:600">(med.)</span>`;
    else if(d?.n) sub=`${d.n.toLocaleString()} jobs`;
    else if(t==="Making good (remedial finishes)") sub="Subcontracted";
    else if(t==="Other") sub="Manual price";
    h+=`<button class="sys-btn ${sel}" data-a="q-type" data-t="${t}">
      <span class="sys-name">${QWT_SHORT[t]||t}</span>
      ${sub?`<span class="sys-n">${sub}</span>`:""}
    </button>`;
  });
  h+="</div>";

  if(mo.wt&&!isMG&&!isOther){
    if(isReline){
      h+=`<p class="slabel" style="margin-top:20px">Length of pipe (optional)</p>
        <input type="number" id="m-inp" class="text-inp" placeholder="Enter metres if known, e.g. 24" value="${mo.m}" inputmode="decimal" min="0">`;
      const mVal=parseFloat(mo.m);
      if(mo.m&&mVal>0){
        const relineEst=M.reline.setup+M.reline.per_m*mVal;
        const baseEst=M.quoted.find(d=>d.wt==="Sewer relining")?.base||5543;
        h+=`<div class="reline-warn" style="margin-top:12px">
          <div class="reline-warn-title">${ICO.warn()} Low confidence estimate</div>
          <div class="reline-warn-body">The length model explains only 1 in 5 of real price differences for sewer relining. Junction count, pipe access, ground conditions, and connection complexity drive most of the cost. The owner must review before the quote is sent.</div>
          <div class="reline-est-box">
            <div class="reline-est-row"><span class="reline-est-label">Length model (${mVal}m &times; $${M.reline.per_m} + $${M.reline.setup.toLocaleString()})</span><span class="reline-est-val">${fmt(relineEst)}</span></div>
            <div class="reline-est-row"><span class="reline-est-label">Base rate model (no length)</span><span class="reline-est-val">${fmt(baseEst)}</span></div>
          </div>
        </div>`;
      } else {
        h+=`<div class="warn" style="margin-top:10px"><div class="warn-body">No metres entered &mdash; base rate of ${fmt(M.quoted.find(d=>d.wt==="Sewer relining")?.base||5543)} is used. Enter metres for a length estimate (note: length model is weak).</div></div>`;
      }
    }
    if(wtData&&wtData.conds.length>0){
      h+='<p class="slabel" style="margin-top:20px">Characteristics that apply</p><div class="tlist">';
      wtData.conds.forEach(c=>{
        const chk=mo.chars.has(c.k)?"chk":"";
        const pct=Math.round((c.f-1)*100);
        const sign=pct>=0?"+":"";
        h+=`<div class="trow ${chk}" data-a="q-char" data-k="${c.k}">
          <div class="chkbox">${chk?ICO.chk():""}</div>
          <div class="tcontent">
            <span class="tlabel">${c.lbl}</span>
            <span class="tsub" style="${pct<0?"color:var(--amber)":""}">${sign}${pct}% to estimate</span>
          </div>
        </div>`;
      });
      h+="</div>";
    } else if(wtData){
      h+=`<div class="warn" style="margin-top:16px"><div class="warn-body">No model characteristics for this type. Base estimate: ${fmt(wtData.base)}.${wtData.conf==="medium"?` Only ${wtData.n} historical jobs.`:""}</div></div>`;
    }
    if(wtData?.conf==="medium"){
      h+=`<div class="warn" style="margin-top:12px"><div class="warn-title">${ICO.warn()} Medium confidence</div><div class="warn-body">Only ${wtData.n} historical jobs. Confirm with the owner before using.</div></div>`;
    }
  }
  if(isMG){
    h+=`<p class="slabel" style="margin-top:20px">Estimated sub-contractor cost (optional)</p>
      <input type="number" id="m-price" class="text-inp"
        placeholder="e.g. 1500" value="${mo.price}" inputmode="decimal" min="0">
      <div class="warn" style="margin-top:10px">
        <div class="warn-body">Making good is subcontracted. Enter the trade quote amount above and it will show as a separate line below the plumbing total &mdash; clearly labelled, not included in the plumbing price.</div>
      </div>`;
  }
  if(isOther){
    h+=`<p class="slabel" style="margin-top:20px">Price (manual entry)</p>
      <input type="number" id="m-price" class="text-inp"
        placeholder="Enter your estimated amount" value="${mo.price}" inputmode="decimal" min="0">
      <div class="warn" style="margin-top:10px">
        <div class="warn-body">No model data for this work type. Enter a price manually and it will be included in the total.</div>
      </div>`;
  }
  h+='<div class="scroll-pad"></div>';
  $("m-body").innerHTML=h;

  // Footer: price preview + save
  let footH="";
  const canSave=mo.wt!==null;
  if(canSave&&!isMG&&!isOther&&wtData){
    const mVal=parseFloat(mo.m);
    const useRL=(isReline&&mo.m&&mVal>0);
    let previewEst=wtData.base;
    wtData.conds.forEach(c=>{if(mo.chars.has(c.k)) previewEst*=c.f;});
    if(useRL) previewEst=M.reline.setup+M.reline.per_m*mVal;
    const pLo=Math.round(previewEst*wtData.lo);
    const pHi=Math.round(previewEst*wtData.hi);
    footH+=`<div style="padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px">
      <div style="font-size:20px;font-weight:700;color:var(--text)">${fmt(Math.round(previewEst))}</div>
      <div style="font-size:13px;color:var(--mute)">${rng(pLo,pHi)}${useRL?" &middot; low confidence":""}</div>
    </div>`;
  } else if(canSave&&(isMG||isOther)&&mo.price&&parseFloat(mo.price)>0){
    const label=isMG?"Making good (subcontracted)":"Manual price";
    footH+=`<div style="padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px">
      <div style="font-size:20px;font-weight:700;color:var(--text)">${fmt(parseFloat(mo.price))}</div>
      <div style="font-size:13px;color:var(--mute)">${label}</div>
    </div>`;
  }
  footH+=`<button class="btn-pri" id="m-save" ${canSave?"":"disabled"}>${mo.eid!==null?"Update component":"Add component"}</button>`;
  $("m-foot").innerHTML=footH;

  const mi=$("m-inp");
  if(mi){
    mi.addEventListener("input",e=>{S.qmo.m=e.target.value;renderQMo();});
    if(document.activeElement!==mi){mi.focus();}
  }
  const mpi=$("m-price");
  if(mpi){
    mpi.addEventListener("input",e=>{S.qmo.price=e.target.value;renderQMo();});
    if(document.activeElement!==mpi){mpi.focus();}
  }
}

/* ═══════════════════════════════════════════
   EVENTS — main app
   ═══════════════════════════════════════════ */
$("app").addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el) return;
  const a=el.dataset.a;
  if(a==="open-rmo"){openModal("r",null);}
  else if(a==="r-edit"){const c=S.r.comps.find(x=>x.id===parseInt(el.dataset.id));if(c)openModal("r",c);}
  else if(a==="r-del"){S.r.comps=S.r.comps.filter(x=>x.id!==parseInt(el.dataset.id));renderR();renderP();}
  else if(a==="open-qmo"){openModal("q",null);}
  else if(a==="q-edit"){const c=S.q.comps.find(x=>x.id===parseInt(el.dataset.id));if(c)openModal("q",c);}
  else if(a==="q-del"){S.q.comps=S.q.comps.filter(x=>x.id!==parseInt(el.dataset.id));renderQ();renderQP();}
});

/* ═══════════════════════════════════════════
   EVENTS — modal body (reactive + quoted)
   ═══════════════════════════════════════════ */
$("overlay").addEventListener("click",closeModal);
$("m-close").addEventListener("click",closeModal);

$("modal").addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el) return;
  const a=el.dataset.a;
  if(S.mt==="r"){
    if(a==="r-sys"){
      S.rmo.si=parseInt(el.dataset.i);
      S.rmo.chars=new Set();S.rmo.act=null;S.rmo.addons=new Set();
      renderRMo();
    }
    else if(a==="r-act"){S.rmo.act=el.dataset.k;renderRMo();}
    else if(a==="r-char"){const k=el.dataset.k;S.rmo.chars.has(k)?S.rmo.chars.delete(k):S.rmo.chars.add(k);renderRMo();}
    else if(a==="r-addon"){const k=el.dataset.k;S.rmo.addons.has(k)?S.rmo.addons.delete(k):S.rmo.addons.add(k);renderRMo();}
    else if(a==="r-asb"){S.rmo.asbestos=!S.rmo.asbestos;renderRMo();}
  } else {
    if(a==="q-type"){S.qmo.wt=el.dataset.t;S.qmo.chars=new Set();S.qmo.m="";S.qmo.price="";renderQMo();}
    else if(a==="q-char"){const k=el.dataset.k;S.qmo.chars.has(k)?S.qmo.chars.delete(k):S.qmo.chars.add(k);renderQMo();}
  }
});

$("m-foot").addEventListener("click",e=>{
  if(e.target.id!=="m-save") return;
  if(S.mt==="r"){
    const mo=S.rmo;
    if(mo.si===null) return;
    const comp={id:mo.eid??S.r.nid++,si:mo.si,act:mo.act,chars:new Set(mo.chars),addons:new Set(mo.addons),asbestos:mo.asbestos};
    if(mo.eid!==null){const i=S.r.comps.findIndex(c=>c.id===mo.eid);if(i>=0)S.r.comps[i]=comp;}
    else S.r.comps.push(comp);
    closeModal();renderR();renderP();
  } else {
    const mo=S.qmo;
    if(!mo.wt) return;
    const comp={id:mo.eid??S.q.nid++,wt:mo.wt,m:mo.m,chars:new Set(mo.chars),price:mo.price};
    if(mo.eid!==null){const i=S.q.comps.findIndex(c=>c.id===mo.eid);if(i>=0)S.q.comps[i]=comp;}
    else S.q.comps.push(comp);
    closeModal();renderQ();renderQP();
  }
});

/* ═══════════════════════════════════════════
   EVENTS — tabs
   ═══════════════════════════════════════════ */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    S.tab=btn.dataset.tab;S.rpx=false;S.qpx=false;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    $("vr").style.display=S.tab==="reactive"?"":"none";
    $("vq").style.display=S.tab==="quoted"?"":"none";
    renderP();
  });
});

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
renderR();renderQ();renderP();
</script>
</body>
</html>
